<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyFlow">
<title>StudyFlow</title>
<style>
:root{--bg:#f5f5f3;--page-bg:#f5f5f3;--card:#fff;--fg:#171717;--muted:#777;--line:#e6e6e3;--soft:#ededeb}
:root.dark{--bg:#111;--page-bg:#111;--card:#1d1d1d;--fg:#f5f5f5;--muted:#aaa;--line:#333;--soft:#292929}
*{box-sizing:border-box}
body{margin:0;background:var(--page-bg);color:var(--fg);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:27px;letter-spacing:-1px;margin:0;font-weight:800}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
button,input,select{font:inherit}
button{border:0;border-radius:12px;background:var(--fg);color:var(--bg);padding:11px 14px;font-weight:650;cursor:pointer}
button.secondary{background:var(--soft);color:var(--fg)}
button.ghost{background:transparent;color:var(--fg);padding:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:stretch;justify-content:space-between;gap:3px;width:calc(100% - 28px);max-width:520px;height:56px;padding:6px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px #00000018;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
nav button{flex:1 1 0;min-width:0;width:0;height:42px;min-height:42px;max-height:42px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;white-space:nowrap;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:0 2px;margin:0;border-radius:999px;line-height:1;align-self:center}
nav button.active{background:var(--fg);color:var(--bg)}
main{padding:0 16px 125px;max-width:700px;margin:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:13px}
.big{font-size:28px;font-weight:800;letter-spacing:-1px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:var(--fg);border-radius:99px}
h2{font-size:17px;margin:0 0 12px}
.stack{display:grid;gap:9px}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .grow{flex:1;min-width:0}
.item small{display:block;color:var(--muted);margin-top:3px}
.check{width:22px;height:22px;accent-color:var(--fg);flex:0 0 auto}
.pill{font-size:11px;color:var(--muted);background:var(--soft);padding:5px 8px;border-radius:99px}
input,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:12px;border-radius:11px;outline:none}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:13px}
.danger{color:#b44!important}
.hidden{display:none!important}
.sectionhead{margin:18px 2px 10px;display:flex;justify-content:space-between;align-items:center}
footer{text-align:center;color:var(--muted);font-size:11px;padding:10px 20px 30px}
.notice{padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:12px;margin-bottom:12px}
.completed-list{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft)}.completed-list summary{font-size:13px;color:var(--muted);cursor:pointer}.completed-list .item{padding:8px 0}.done-name{color:var(--muted);text-decoration:line-through}.color-row{display:flex;align-items:center;gap:12px}.color-row input[type=color]{width:54px;height:42px;padding:3px;border-radius:10px}.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.swatch{width:30px;height:30px;padding:0;border:2px solid var(--line);border-radius:50%}.swatch.selected{outline:2px solid var(--fg);outline-offset:2px}
.rest-between{text-align:center;color:var(--muted);font-size:12px;padding:9px 0;border-bottom:1px dashed var(--line)}.iconbtn{padding:7px 9px;font-size:12px;border-radius:9px}.item-actions{display:flex;gap:4px;flex:0 0 auto}.fieldgrid{display:grid;gap:9px}.unit-choice{display:flex;align-items:center;gap:9px;padding:8px 0}.unit-choice input{width:20px;flex:0 0 auto}.formhint{font-size:12px;color:var(--muted);margin-top:6px}

/* calm, consistent spacing and compact floating editors */
.head-actions{display:flex;gap:7px;align-items:center}.head-actions button{padding:9px 11px;font-size:13px}
.item{min-width:0;gap:12px;padding:13px 0}.item .grow{overflow-wrap:anywhere}.item-actions{align-items:center;justify-content:flex-end}.iconbtn{font-size:12px;padding:8px 9px}
input,select{min-height:46px;text-align:left}button{min-height:40px;display:inline-flex;align-items:center;justify-content:center}button:disabled{opacity:.4}
.panel{padding:17px}.sectionhead{gap:10px}.sectionhead h2{margin:0}
.modal-backdrop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,10,10,.34);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .16s ease}
.task-modal{width:min(100%,390px);max-height:min(82vh,620px);overflow-y:auto;overscroll-behavior:contain;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:24px;padding:21px;box-shadow:0 20px 60px #0003;animation:modalUp .18s ease-out}.task-modal>.row:first-child{position:sticky;top:-21px;z-index:3;background:var(--card);padding:4px 0 10px;margin: -4px 0 10px}.task-modal>.actions:last-child{position:sticky;bottom:-21px;z-index:3;background:var(--card);padding:12px 0 2px;margin:18px 0 -2px;border-top:1px solid var(--line)}
.datetime-center{text-align:center;text-align-last:center;padding-left:8px;padding-right:8px}
.datetime-center::-webkit-date-and-time-value{text-align:center;margin:0 auto;width:100%}
.datetime-center::-webkit-calendar-picker-indicator{margin-left:6px}
.task-modal h2{margin:3px 0 0}.task-modal .row{margin-bottom:10px}.task-modal .actions{margin-top:18px}.task-modal .primary-action{width:100%}
.stats-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stats-metric{background:var(--soft);border-radius:14px;padding:12px 10px;min-width:0}.stats-metric .big{font-size:23px}.stats-detail{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.stats-detail summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:650;font-size:14px}.stats-detail summary::-webkit-details-marker{display:none}.stats-detail summary:after{content:'＋';color:var(--muted);font-weight:400}.stats-detail[open] summary:after{content:'－'}.stats-detail-body{padding-top:12px}.code-field{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin:8px 0}.code-field label{margin:0}.code-field input{min-height:40px}.rest-chip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;margin:3px 0 7px 34px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:12px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes modalUp{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:390px){.head-actions button{padding:8px 9px;font-size:12px}.item-actions{gap:1px}.iconbtn{padding:7px 6px;font-size:11px}.task-item .grow strong{font-size:14px}}

</style>
</head>
<body>
<header>
  <div><h1>StudyFlow<span style="font-weight:400">.</span></h1><div class="sub">讓每一天的努力都有方向</div></div>
  <button class="ghost" id="themeBtn" aria-label="切換深色模式" type="button">◐</button>
</header>
<nav id="tabs" aria-label="主要功能">
  <button class="active" data-tab="today" type="button">今日</button>
  <button data-tab="subjects" type="button">科目</button>
  <button data-tab="exams" type="button">考試</button>
  <button data-tab="stats" type="button">統計</button>
  <button data-tab="examstats" type="button">成績</button>
  <button data-tab="settings" type="button">設定</button>
</nav>
<main id="app"></main>
<footer>StudyFlow · 資料儲存在這台 iPhone</footer>
<script>
(function () {
  'use strict';
  const KEY = 'studyflow_v1';
  const THEME_KEY = 'studyflow_theme';
  const EMPTY_DB = () => ({subjects: [], units: [], tasks: [], exams: [], examUnits: [], rests: [], testRecords: []});
  let db = EMPTY_DB();
  let tab = 'today';

  const $ = (selector, root) => (root || document).querySelector(selector);
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);

  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (_) { return null; }
  }
  function safeSet(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (_) { return false; }
  }
  function normalizeData(value) {
    const source = value && typeof value === 'object' ? value : {};
    return {
      subjects: Array.isArray(source.subjects) ? source.subjects : [],
      units: Array.isArray(source.units) ? source.units : [],
      tasks: Array.isArray(source.tasks) ? source.tasks : [],
      exams: Array.isArray(source.exams) ? source.exams : [],
      examUnits: Array.isArray(source.examUnits) ? source.examUnits : [],
      rests: Array.isArray(source.rests) ? source.rests : [],
      testRecords: Array.isArray(source.testRecords) ? source.testRecords : [],
      examCodeSettings: source.examCodeSettings && typeof source.examCodeSettings === 'object' ? source.examCodeSettings : {}
    };
  }
  try {
    const saved = safeGet(KEY);
    if (saved) db = normalizeData(JSON.parse(saved));
  } catch (_) {
    db = EMPTY_DB();
  }

  function localDate() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return year + '-' + month + '-' + day;
  }
  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function percent(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function subjectName(subjectId) {
    const item = db.subjects.find(x => x.id === subjectId);
    return item ? item.name : '未分類';
  }
  function save() {
    const ok = safeSet(KEY, JSON.stringify(db));
    render();
    if (!ok) alert('iPhone 暫時無法儲存資料。請確認 Safari 沒有使用私人瀏覽，並保留足夠儲存空間。');
  }

  function taskRow(task) {
    const unit = task.unit ? db.units.find(x => x.id === task.unit) : null;
    return `<div class="item task-item">
      <input class="check" type="checkbox" data-action="toggle-task" data-id="${esc(task.id)}" ${task.done ? 'checked' : ''} aria-label="完成任務">
      <div class="grow"><strong>${esc(task.title)}</strong><small>${unit ? esc(unit.name) + ' · ' : ''}${task.time ? esc(task.time) : '未設定時間'}</small></div>
      <div class="item-actions"><button class="ghost iconbtn" type="button" data-action="add-rest" data-id="${esc(task.id)}">＋休息</button><button class="ghost iconbtn" type="button" data-action="edit-task" data-id="${esc(task.id)}">編輯</button><button class="ghost danger iconbtn" type="button" data-action="delete-task" data-id="${esc(task.id)}">刪除</button></div>
    </div>`;
  }

  function restRow(rest) {
    return `<div class="rest-chip"><span>休息 · ${Number(rest.minutes)} 分鐘</span><button class="ghost danger iconbtn" type="button" data-action="delete-rest" data-id="${esc(rest.id)}">移除</button></div>`;
  }

  function todayView() {
    const tasks = db.tasks.filter(t => t.date === localDate()).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
    const done = tasks.filter(t => t.done).length;
    const open = tasks.filter(t => !t.done);
    const schedule = open.map(task => {
      const rests = (db.rests || []).filter(r => r.date === localDate() && r.afterTaskId === task.id);
      return taskRow(task) + rests.map(restRow).join('');
    }).join('');
    const restsWithoutAnchor = (db.rests || []).filter(r => r.date === localDate() && !tasks.some(t => t.id === r.afterTaskId));
    return `<div class="panel"><div class="row"><div><div class="muted">今天的學習進度</div><div class="big">${percent(done, tasks.length)}%</div></div><span class="pill">${done} / ${tasks.length} 完成</span></div><div class="bar"><span style="width:${percent(done, tasks.length)}%"></span></div></div>
      <div class="sectionhead"><h2>今日任務</h2><div class="head-actions"><button class="secondary" type="button" data-action="add-rest">＋ 新增休息</button><button type="button" data-action="add-task">＋ 新增</button></div></div>
      ${open.length || restsWithoutAnchor.length ? `<div class="panel">${schedule}${restsWithoutAnchor.map(restRow).join('')}</div>` : `<div class="panel empty">今天還沒有待完成任務，新增一項開始吧。</div>`}
      ${done ? `<div class="sectionhead"><h2>已完成</h2><span class="pill">${done}</span></div><div class="panel">${tasks.filter(t => t.done).map(taskRow).join('')}</div>` : ''}
      <div class="sectionhead"><h2>快速新增任務</h2></div><div class="panel"><input id="quickTask" placeholder="例如：完成英文單字 20 個"><div class="actions"><button type="button" data-action="quick-add">加入今日任務</button></div></div>`;
  }

  function taskEditor(task, unitId) {
    const isEdit = !!task;
    const value = task || {title: (unitId && db.units.find(x=>x.id===unitId)?.name) || '', date:localDate(), time:'', unit:unitId || ''};
    const dateTime = (value.date || localDate()) + 'T' + (value.time || '19:00');
    $('#app').insertAdjacentHTML('beforeend', `<div class="modal-backdrop" data-action="modal-close"><div class="task-modal" role="dialog" aria-modal="true" aria-label="${isEdit?'編輯任務':'新增任務'}"><div class="row"><div><div class="muted">STUDYFLOW</div><h2>${isEdit?'編輯任務':'新增任務'}</h2></div><button class="ghost" type="button" data-action="cancel-task">取消</button></div><label for="taskTitle">任務內容</label><input id="taskTitle" value="${esc(value.title)}" placeholder="例如：數學第三章"/><label for="taskDateTime">日期與時間</label><input id="taskDateTime" class="datetime-center" type="datetime-local" value="${esc(dateTime)}"/><div class="formhint">在同一個小視窗中選擇日期與開始時間。</div><input id="taskUnit" type="hidden" value="${esc(value.unit || '')}"/><input id="taskId" type="hidden" value="${esc(value.id || '')}"/><div class="actions"><button class="primary-action" type="button" data-action="save-task">${isEdit?'儲存修改':'建立任務'}</button></div></div></div>`);
  }

  function restEditor(afterTaskId) {
    const todays = db.tasks.filter(t => t.date === localDate()).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
    const selected = afterTaskId || (todays[0] && todays[0].id) || '';
    const options = `<option value="" ${selected?'':'selected'}>不指定任務（放在清單底部）</option>` + todays.map(t => `<option value="${esc(t.id)}" ${selected===t.id?'selected':''}>${esc(t.title)}</option>`).join('');
    $('#app').insertAdjacentHTML('beforeend', `<div class="modal-backdrop" data-action="modal-close"><div class="task-modal" role="dialog" aria-modal="true" aria-label="新增休息"><div class="row"><div><div class="muted">STUDYFLOW</div><h2>新增休息</h2></div><button class="ghost" type="button" data-action="cancel-task">取消</button></div><label for="restAfter">安排在任務之後</label><select id="restAfter">${options || '<option value="">不指定任務（放在清單底部）</option>'}</select><label for="restDuration">休息時間</label><select id="restDuration">${[5,10,15,20,25,30,45,60].map(n=>`<option value="${n}" ${n===10?'selected':''}>${n} 分鐘</option>`).join('')}</select><div class="actions"><button class="primary-action" type="button" data-action="save-rest">加入休息</button></div></div></div>`);
  }

  function subjectsView() {
    const cards = db.subjects.map(subject => {
      const units = db.units.filter(unit => unit.subject === subject.id);
      const done = units.filter(unit => unit.done).length;
      const activeUnits = units.filter(unit => !unit.done);
      const completedUnits = units.filter(unit => unit.done);
      const unitRow = (unit, completed=false) => { const origins=(unit.sourceExamIds|| (unit.sourceExamId?[unit.sourceExamId]:[])).map(id=>db.testRecords?.find(r=>r.id===id)).filter(Boolean); const sourceText=origins.length?`<small style="color:var(--muted);opacity:.72">來源：${origins.map(r=>esc(r.type+' '+r.date)).join('、')}</small>`:''; return `<div class="item"><input class="check" type="checkbox" data-action="toggle-unit" data-id="${esc(unit.id)}" ${unit.done ? 'checked' : ''} aria-label="完成單元"><div class="grow ${completed ? 'done-name' : ''}">${esc(unit.name)}${sourceText}</div><div class="item-actions">${completed ? '' : `<button class="ghost" type="button" data-action="make-task" data-id="${esc(unit.id)}">排入今日</button>`}<button class="ghost iconbtn" type="button" data-action="edit-unit" data-id="${esc(unit.id)}">✏️</button><button class="ghost danger iconbtn" type="button" data-action="delete-unit" data-id="${esc(unit.id)}">🗑️</button></div></div>`; };
      return `<div class="panel"><div class="row"><div><h2>${esc(subject.name)}</h2><div class="muted">${done}/${units.length} 個單元完成</div></div><button class="secondary" type="button" data-action="add-unit" data-id="${esc(subject.id)}">＋ 單元</button></div>
        <div class="bar"><span style="width:${percent(done, units.length)}%"></span></div>
        <div class="item-actions" style="margin-top:10px"><button class="secondary iconbtn" type="button" data-action="edit-subject" data-id="${esc(subject.id)}">✏️ 修改科目</button><button class="ghost danger iconbtn" type="button" data-action="delete-subject" data-id="${esc(subject.id)}">🗑️ 刪除科目</button></div>
        ${activeUnits.length ? activeUnits.map(unit => unitRow(unit)).join('') : (units.length ? '<div class="empty">這科的單元都完成了！</div>' : '<div class="empty">尚未新增單元</div>')}
        ${completedUnits.length ? `<details class="completed-list"><summary>已完成單元（${completedUnits.length}）</summary>${completedUnits.map(unit => unitRow(unit, true)).join('')}</details>` : ''}</div>`;
    }).join('');
    return `<div class="row sectionhead"><h2>我的科目</h2><button type="button" data-action="add-subject">＋ 新增科目</button></div>${cards || '<div class="panel empty">先新增一個科目，例如：國文、英文、數學。</div>'}`;
  }

  function examsView() {
    const cards = db.exams.map(exam => {
      const selected = db.examUnits.filter(x => x.exam === exam.id);
      const units = selected.map(x => db.units.find(u => u.id === x.unit)).filter(Boolean);
      const done = units.filter(u => u.done).length;
      return `<div class="panel"><div class="row"><div><h2>${esc(exam.name)}</h2><div class="muted">${esc(exam.date || '未設定日期')} · ${units.length} 個範圍單元</div></div><div class="item-actions"><button class="ghost iconbtn" type="button" data-action="edit-exam" data-id="${esc(exam.id)}">✏️</button><button class="ghost danger iconbtn" type="button" data-action="delete-exam" data-id="${esc(exam.id)}">🗑️</button></div></div>
        <div class="row" style="margin-top:12px"><span class="muted">準備進度</span><strong>${percent(done, units.length)}%</strong></div><div class="bar"><span style="width:${percent(done, units.length)}%"></span></div>
        <div class="actions"><button class="secondary" type="button" data-action="choose-exam-units" data-id="${esc(exam.id)}">選取考試範圍</button></div></div>`;
    }).join('');
    const subjectOptions = db.subjects.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
    return `<div class="panel"><h2>新增考試</h2><div class="fieldgrid"><div><label for="examName">考試名稱</label><input id="examName" placeholder="例如：第一次段考"></div><div><label for="examDate">考試日期</label><input id="examDate" type="date" value="${localDate()}"></div><div><label for="examSubject">科目</label><select id="examSubject"><option value="">選擇科目</option>${subjectOptions}</select></div><div class="formhint">新增後可按「選取考試範圍」勾選單元。</div><button type="button" data-action="add-exam">＋ 建立考試</button></div></div>
      <div class="sectionhead"><h2>我的考試</h2></div>${cards || '<div class="panel empty">目前沒有考試，先在上方新增一個吧。</div>'}`;
  }

  function statsView() {
    const total = db.units.length, done = db.units.filter(x => x.done).length;
    const taskTotal = db.tasks.length, taskDone = db.tasks.filter(x => x.done).length;
    const subjects = db.subjects.map(subject => {
      const units = db.units.filter(x => x.subject === subject.id);
      const count = units.filter(x => x.done).length;
      return `<div style="margin:13px 0"><div class="row"><strong>${esc(subject.name)}</strong><span class="muted">${percent(count, units.length)}%</span></div><div class="bar"><span style="width:${percent(count, units.length)}%"></span></div></div>`;
    }).join('');
    return `<div class="panel"><div class="muted">單元完成率</div><div class="big">${percent(done, total)}%</div><div class="bar"><span style="width:${percent(done, total)}%"></span></div><div class="muted" style="margin-top:8px">${done} / ${total} 個單元</div></div>
      <div class="panel"><div class="muted">任務完成率</div><div class="big">${percent(taskDone, taskTotal)}%</div><div class="bar"><span style="width:${percent(taskDone, taskTotal)}%"></span></div><div class="muted" style="margin-top:8px">${taskDone} / ${taskTotal} 項任務</div></div>
      <div class="panel"><h2>各科目進度</h2>${subjects || '<div class="empty">新增科目後會顯示統計。</div>'}</div>`;
  }

  const TEST_TYPES = ['課堂小考','黃卷','段考','模擬考'];
  function getExamCodeSettings() {
    const current = db.examCodeSettings || {};
    const subjectCodes = {...(current.subjectCodes || {})};
    db.subjects.forEach((subject, index) => { if (!subjectCodes[subject.id]) subjectCodes[subject.id] = String(index + 1).padStart(2, '0'); });
    const typeCodes = {...(current.typeCodes || {})};
    ['課堂小考','黃卷','段考','模擬考'].forEach((type, index) => { if (!typeCodes[type]) typeCodes[type] = String(index + 1); });
    return {subjectCodes, typeCodes, serialWidth: Math.max(1, Math.min(4, Number(current.serialWidth) || 1)), template: current.template || '{subject}{type}{serial}'};
  }
  function makeExamCode(subjectId, type) {
    const settings = getExamCodeSettings();
    const subjectCode = settings.subjectCodes[subjectId] || '00';
    const typeCode = settings.typeCodes[type] || '0';
    const sameKind = (db.testRecords || []).filter(r => r.subject === subjectId && r.type === type);
    const serial = String(sameKind.length + 1).padStart(settings.serialWidth, '0');
    return settings.template.replace(/\{subject\}/g, subjectCode).replace(/\{type\}/g, typeCode).replace(/\{serial\}/g, serial);
  }
  function saveExamCodeSettings() {
    const subjectCodes = {};
    document.querySelectorAll('[data-subject-code]').forEach(input => subjectCodes[input.dataset.subjectCode] = input.value.trim());
    const typeCodes = {};
    document.querySelectorAll('[data-type-code]').forEach(input => typeCodes[input.dataset.typeCode] = input.value.trim());
    const width = Number($('#serialWidth')?.value || 1);
    const template = ($('#codeTemplate')?.value || '{subject}{type}{serial}').trim();
    if (!template.includes('{subject}') || !template.includes('{type}') || !template.includes('{serial}')) { alert('編號格式必須包含 {subject}、{type}、{serial} 三個欄位。'); return; }
    if (Object.values(subjectCodes).some(v => !v) || Object.values(typeCodes).some(v => !v)) { alert('代碼不能留空。'); return; }
    db.examCodeSettings = {subjectCodes, typeCodes, serialWidth:width, template};
    save();
    alert('考試編號規則已儲存。新紀錄會使用新規則，舊紀錄編號不變。');
  }

  function testRecordEditor() {
    if (!db.subjects.length) { alert('請先到「科目」新增科目。'); return; }
    const subjectChoices = db.subjects.map((x,i) => `<label class="unit-choice"><input type="radio" name="testSubject" value="${esc(x.id)}" ${i===0?'checked':''}><span>${esc(x.name)}</span></label>`).join('');
    $('#app').insertAdjacentHTML('beforeend', `<div class="modal-backdrop" data-action="modal-close"><div class="task-modal" role="dialog" aria-modal="true" aria-label="新增考試成績"><div class="row"><div><div class="muted">STUDYFLOW</div><h2>新增考試紀錄</h2></div><button class="ghost" type="button" data-action="cancel-task">取消</button></div><label for="testName">考試名稱</label><input id="testName" placeholder="例如：第二次段考數學"/><label>考試科目（選一科）</label><div>${subjectChoices}</div><label for="testType">考試類型</label><select id="testType">${TEST_TYPES.map(type=>`<option>${type}</option>`).join('')}</select><label for="testScore">成績（滿分 100）</label><input id="testScore" type="number" min="0" max="100" step="0.1" placeholder="例如：86"><label for="testDate">考試日期</label><input id="testDate" type="date" value="${localDate()}"><label>這張考卷抓到的讀書盲點</label><div class="row" style="gap:6px"><input id="blindspotInput" placeholder="例如：1-1 一次函數觀念"><button class="secondary" type="button" data-action="add-blindspot-draft">新增</button></div><div id="blindspotDrafts" class="stack" style="margin-top:8px"></div><div class="formhint">新增的盲點會自動加入該科目的單元清單，並標示來源考卷。</div><div class="actions"><button class="primary-action" type="button" data-action="save-test-record">儲存考試紀錄</button></div></div></div>`);
    window.__studyflowBlindspots = [];
  }
  function renderBlindspotDrafts() {
    const root=$('#blindspotDrafts'); if(!root) return;
    const list=window.__studyflowBlindspots || [];
    root.innerHTML=list.map((name,i)=>`<div class="row"><span class="muted">${esc(name)}</span><button class="ghost danger iconbtn" type="button" data-action="remove-blindspot-draft" data-index="${i}">移除</button></div>`).join('') || '<div class="muted">尚未新增盲點</div>';
  }
  function saveTestRecord() {
    const subject=$('input[name="testSubject"]:checked');
    const scoreField=$('#testScore'), score=Number(scoreField?.value);
    if(!subject){alert('請選擇考試科目。');return;}
    if(!scoreField || scoreField.value.trim()==='' || !Number.isFinite(score) || score<0 || score>100){alert('成績請填寫 0 到 100 之間的數字。');return;}
    const name=$('#testName')?.value.trim();
    if(!name){alert('請輸入考試名稱。');return;}
    const type=$('#testType').value, date=$('#testDate').value || localDate();
    const record={id:makeId(),name,code:makeExamCode(subject.value,type),subject:subject.value,type,score,date,corrected:false,blindspots:[]};
    (window.__studyflowBlindspots||[]).forEach(name=>{
      let unit=db.units.find(u=>u.subject===subject.value && u.name.trim().toLowerCase()===name.trim().toLowerCase());
      if(!unit){unit={id:makeId(),subject:subject.value,name,done:false,sourceExamIds:[record.id]};db.units.push(unit);} else {unit.done=false;unit.sourceExamIds=unit.sourceExamIds|| (unit.sourceExamId?[unit.sourceExamId]:[]); if(!unit.sourceExamIds.includes(record.id))unit.sourceExamIds.push(record.id);}
      record.blindspots.push({name,unitId:unit.id});
    });
    db.testRecords=db.testRecords||[];db.testRecords.push(record);window.__studyflowBlindspots=[];save();
  }
  function examStatsView() {
    const records=(db.testRecords||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const subjectId=$('#examStatsSubject')?.value || (db.subjects[0]?.id || '');
    const subjectRecords=records.filter(r=>r.subject===subjectId);
    const options=db.subjects.map(s=>`<option value="${esc(s.id)}" ${s.id===subjectId?'selected':''}>${esc(s.name)}</option>`).join('');
    const points=subjectRecords.map(r=>({date:r.date,score:Number(r.score)||0}));
    let chart='';
    if(points.length){
      const w=320,h=150,pad=24, coords=points.map((p,i)=>({x:pad+(points.length===1?(w-pad*2)/2:i*(w-pad*2)/(points.length-1)),y:h-pad-(p.score/100)*(h-pad*2)}));
      const poly=coords.map(c=>`${c.x},${c.y}`).join(' ');
      chart=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="成績折線圖"><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--line)"/><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/><polyline points="${poly}" fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${coords.map((c,i)=>`<circle cx="${c.x}" cy="${c.y}" r="4" fill="var(--fg)"/><text x="${c.x}" y="${Math.max(12,c.y-9)}" text-anchor="middle" font-size="10" fill="var(--muted)">${points[i].score}</text>`).join('')}</svg>`;
    } else chart='<div class="empty">新增考試紀錄後，這裡會顯示成績變化。</div>';
    const blindspotMap=new Map();
    subjectRecords.forEach(r=>(r.blindspots||[]).forEach(b=>{const key=b.unitId||b.name;const v=blindspotMap.get(key)||{name:b.name,count:0,unitId:b.unitId};v.count++;blindspotMap.set(key,v);}));
    const blindspots=[...blindspotMap.values()].sort((a,b)=>b.count-a.count);
    const max=Math.max(1,...blindspots.map(b=>b.count));
    const blindRows=blindspots.map(b=>{const unit=db.units.find(u=>u.id===b.unitId);const solved=!!unit?.done;return `<div style="margin:13px 0"><div class="row"><strong>${esc(b.name)}</strong><span class="muted">${solved?'已改善':'待加強'} · 累積 ${b.count} 次</span></div><div class="bar"><span style="width:${solved?8:Math.max(8,b.count/max*100)}%;opacity:${solved?.55:1}"></span></div></div>`;}).join('');
    const uncorrected=(db.testRecords||[]).filter(r=>!r.corrected).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const correctionButton=r=>`<button class="${r.corrected?'secondary':'ghost'} iconbtn" type="button" data-action="toggle-corrected" data-id="${esc(r.id)}">${r.corrected?'✓ 已訂正':'標記已訂正'}</button>`;
    const uncorrectedRows=uncorrected.map(r=>`<div class="item"><div class="grow"><strong>${esc(r.name || r.type)}</strong><small>${esc(subjectName(r.subject))} · ${esc(r.date)} · ${esc(r.score)} 分</small></div>${correctionButton(r)}</div>`).join('');
    const history=subjectRecords.slice().reverse().map(r=>`<div class="item"><div class="grow"><strong>${esc(r.name || r.type)}</strong><small>${esc(r.code || '尚無編號')} · ${esc(r.type)} · ${esc(r.date)} · ${r.corrected?'已訂正':'未訂正'} · ${esc(r.blindspots?.length||0)} 個盲點</small></div><strong>${esc(r.score)} 分</strong>${correctionButton(r)}<button class="ghost danger iconbtn" type="button" data-action="delete-test-record" data-id="${esc(r.id)}">刪除</button></div>`).join('');
    const avg=subjectRecords.length?Math.round(subjectRecords.reduce((a,r)=>a+Number(r.score||0),0)/subjectRecords.length*10)/10:0;
    const best=subjectRecords.length?Math.max(...subjectRecords.map(r=>Number(r.score)||0)):'—';
    return `<div class="row sectionhead"><h2>成績總覽</h2><button type="button" data-action="add-test-record">＋ 新增</button></div><div class="panel"><label for="examStatsSubject">科目</label><select id="examStatsSubject" data-action="filter-exam-stats">${options||'<option value="">尚無科目</option>'}</select><div class="stats-summary" style="margin-top:12px"><div class="stats-metric"><div class="muted">考試</div><div class="big">${subjectRecords.length}</div></div><div class="stats-metric"><div class="muted">平均</div><div class="big">${subjectRecords.length?avg:'—'}</div></div><div class="stats-metric"><div class="muted">最高</div><div class="big">${best}</div></div></div></div><div class="panel"><h2>待訂正考卷 <span class="muted">${uncorrected.length} 張</span></h2>${uncorrectedRows||'<div class="empty">太好了！目前沒有待訂正考卷。</div>'}</div><div class="panel"><details class="stats-detail"><summary>成績變化 <span class="muted">${subjectRecords.length} 筆紀錄</span></summary><div class="stats-detail-body">${chart}</div></details><details class="stats-detail"><summary>讀書盲點 <span class="muted">${blindspots.length} 項</span></summary><div class="stats-detail-body"><div class="muted">完成對應單元後會自動標記為已改善。</div>${blindRows||'<div class="empty">目前沒有盲點紀錄。</div>'}</div></details><details class="stats-detail"><summary>考試紀錄 <span class="muted">${subjectRecords.length} 筆</span></summary><div class="stats-detail-body">${history||'<div class="empty">尚無考試紀錄。</div>'}</div></details></div>`;
  }

  function settingsView() {
    const cfg=getExamCodeSettings();
    const subjectFields=db.subjects.map(subject=>`<div class="code-field"><label>${esc(subject.name)} 代碼</label><input data-subject-code="${esc(subject.id)}" value="${esc(cfg.subjectCodes[subject.id]||'')}" maxlength="8" aria-label="${esc(subject.name)}代碼"></div>`).join('');
    const typeFields=TEST_TYPES.map(type=>`<div class="code-field"><label>${esc(type)}代碼</label><input data-type-code="${esc(type)}" value="${esc(cfg.typeCodes[type]||'')}" maxlength="8" aria-label="${esc(type)}代碼"></div>`).join('');
    return `<div class="panel"><h2>考試編號規則</h2><p class="muted">在這裡統一修改科目代碼、考試類型代碼及編號格式。修改後只套用到新紀錄，舊紀錄不會被改動。</p><h2 style="margin-top:16px">科目代碼</h2>${subjectFields||'<div class="empty">先新增科目，就能設定科目代碼。</div>'}<h2 style="margin-top:18px">考試類型代碼</h2>${typeFields}<label for="serialWidth">流水號位數</label><select id="serialWidth">${[1,2,3,4].map(n=>`<option value="${n}" ${cfg.serialWidth===n?'selected':''}>${n} 位</option>`).join('')}</select><label for="codeTemplate">編號組合格式</label><input id="codeTemplate" value="${esc(cfg.template)}" placeholder="{subject}{type}{serial}"><div class="formhint">可使用 {subject}（科目）、{type}（類型）、{serial}（流水號），也可自行加入符號。例如：{subject}-{type}-{serial}</div><div class="actions"><button type="button" data-action="save-code-settings">儲存編號規則</button></div></div>
      <div class="panel"><h2>資料備份</h2><p class="muted">資料只存在這台 iPhone，包含科目、任務、考試成績與盲點紀錄。建議定期匯出備份。</p><div class="actions"><button type="button" data-action="backup">匯出備份</button><button class="secondary" type="button" data-action="restore-pick">匯入備份</button><input id="restoreFile" class="hidden" type="file" accept="application/json"></div></div>
      <div class="panel"><h2>資料管理</h2><p class="muted">清除資料會刪除這台裝置上的所有科目、單元、任務與考試。</p><button class="secondary danger" type="button" data-action="clear-all">清除所有資料</button></div>
      <div class="panel"><h2>使用說明</h2><p class="muted">在 Safari 開啟 StudyFlow，按分享圖示，再選「加入主畫面」，即可從 iPhone 主畫面開啟。</p></div>`;
  }

  function render() {
    const root = $('#app');
    if (!root) return;
    $('#tabs').querySelectorAll('button[data-tab]').forEach(button => button.classList.toggle('active', button.dataset.tab === tab));
    const views = {today: todayView, subjects: subjectsView, exams: examsView, stats: statsView, examstats: examStatsView, settings: settingsView};
    root.innerHTML = (views[tab] || todayView)();
  }

  function addSubject() {
    const name = prompt('科目名稱');
    if (name && name.trim()) { db.subjects.push({id:makeId(), name:name.trim()}); save(); }
  }
  function addUnit(subjectId) {
    const name = prompt('單元名稱');
    if (name && name.trim()) { db.units.push({id:makeId(), subject:subjectId, name:name.trim(), done:false}); save(); }
  }
  function addTask() { taskEditor(null, ''); }
  function quickAdd() {
    const field = $('#quickTask');
    if (field && field.value.trim()) { db.tasks.push({id:makeId(), title:field.value.trim(), date:localDate(), time:'', done:false}); save(); }
    else alert('請先輸入任務內容。');
  }
  function saveTaskForm() {
    const title=$('#taskTitle').value.trim(), rawDateTime=$('#taskDateTime').value, unit=$('#taskUnit').value, id=$('#taskId').value;
    if (!title || !rawDateTime) { alert('請填寫任務內容和日期時間。'); return; }
    const parts=rawDateTime.split('T'), date=parts[0], time=parts[1] || '';
    if (id) { const t=db.tasks.find(x=>x.id===id); if(t) Object.assign(t,{title,date,time,unit:unit||undefined}); }
    else db.tasks.push({id:makeId(),title,date,time,done:false,unit:unit||undefined});
    save();
  }
  function saveRest(afterTaskId) {
    const minutes = Number($('#restDuration')?.value || 10);
    const anchor = afterTaskId || $('#restAfter')?.value || '';
    db.rests = db.rests || [];
    db.rests.push({id:makeId(), date:localDate(), afterTaskId:anchor, minutes});
    save();
  }
  function makeTask(unitId) {
    const unit = db.units.find(x => x.id === unitId);
    if (!unit) return;
    taskEditor(null, unitId);
  }
  function deleteTask(id) {
    if (confirm('確定刪除此任務？')) { db.tasks = db.tasks.filter(x => x.id !== id); save(); }
  }
  function addExam() {
    const nameField = $('#examName'), dateField = $('#examDate'), subjectField = $('#examSubject');
    const name = nameField && nameField.value.trim();
    const subjectId = subjectField ? subjectField.value : ''; 
    if (!name) { alert('請輸入考試名稱。'); return; }
    const examId = makeId();
    db.exams.push({id:examId, name, date:dateField ? dateField.value : '', subject:subjectId});
    save();
    if (subjectId) chooseExamUnits(examId, subjectId);
  }
  function chooseExamUnits(examId, defaultSubjectId) {
    if (!db.units.length) { alert('請先到「科目」新增單元。'); return; }
    const exam = db.exams.find(x => x.id === examId);
    if (!exam) return;
    const current = new Set(db.examUnits.filter(x => x.exam === examId).map(x => x.unit));
    const choices = db.units.map(unit => { const checked = current.has(unit.id) || (!!defaultSubjectId && unit.subject === defaultSubjectId); return `<label class="unit-choice"><input type="checkbox" name="examUnitChoice" value="${esc(unit.id)}" ${checked ? 'checked' : ''}><span>${esc(subjectName(unit.subject))}｜${esc(unit.name)}</span></label>`; }).join('');
    const root = $('#app');
    root.innerHTML = `<div class="panel"><div class="row"><h2>選取「${esc(exam.name)}」考試範圍</h2><button class="ghost" type="button" data-action="cancel-exam-units">返回</button></div><div>${choices}</div><div class="actions"><button type="button" data-action="save-exam-units" data-id="${esc(examId)}">儲存範圍</button></div></div>`;
  }
  function editItem(type, id) {
    const collection = type === 'subject' ? db.subjects : type === 'unit' ? db.units : type === 'task' ? db.tasks : db.exams;
    const item = collection.find(x => x.id === id);
    if (!item) return;
    if (type === 'task') { taskEditor(item); return; }
    const field = type === 'subject' ? 'name' : type === 'unit' ? 'name' : type === 'task' ? 'title' : 'name';
    const label = type === 'subject' ? '科目名稱' : type === 'unit' ? '單元名稱' : type === 'task' ? '任務內容' : '考試名稱';
    const value = prompt('修改' + label, item[field] || '');
    if (value === null || !value.trim()) return;
    item[field] = value.trim();
    if (type === 'exam') {
      const date = prompt('考試日期（YYYY-MM-DD，可留空）', item.date || '');
      if (date !== null) item.date = date.trim();
    }
    save();
  }
  function deleteItem(type, id) {
    if (type === 'subject') {
      if (!confirm('刪除此科目，也會刪除底下單元及相關考試範圍，確定嗎？')) return;
      const unitIds = db.units.filter(x => x.subject === id).map(x => x.id);
      db.subjects = db.subjects.filter(x => x.id !== id);
      db.units = db.units.filter(x => x.subject !== id);
      db.examUnits = db.examUnits.filter(x => !unitIds.includes(x.unit));
      db.tasks = db.tasks.filter(x => !unitIds.includes(x.unit));
    } else if (type === 'unit') {
      if (!confirm('刪除此單元，也會移除相關考試範圍及連結任務，確定嗎？')) return;
      db.units = db.units.filter(x => x.id !== id);
      db.examUnits = db.examUnits.filter(x => x.unit !== id);
      db.tasks = db.tasks.filter(x => x.unit !== id);
    }
    save();
  }


  function backup() {
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = 'StudyFlow-backup.json';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function restoreFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = normalizeData(JSON.parse(reader.result));
        if (!confirm('匯入會覆蓋目前資料，確定嗎？')) return;
        db = imported; save(); alert('匯入完成');
      } catch (_) { alert('備份檔格式不正確'); }
    };
    reader.readAsText(file);
  }

  $('#tabs').addEventListener('click', event => {
    const button = event.target.closest('button[data-tab]');
    if (!button) return;
    tab = button.dataset.tab;
    render();
  });

  $('#app').addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if (!button) { if (event.target.classList && event.target.classList.contains('modal-backdrop')) { event.target.remove(); } return; }
    const action = button.dataset.action;
    const id = button.dataset.id;
    if (action === 'add-subject') addSubject();
    else if (action === 'add-unit') addUnit(id);
    else if (action === 'add-task') addTask();
    else if (action === 'quick-add') quickAdd();
    else if (action === 'add-rest') restEditor(id || '');
    else if (action === 'save-rest') saveRest();
    else if (action === 'delete-rest') { db.rests=(db.rests||[]).filter(r=>r.id!==id); save(); }
    else if (action === 'save-task') saveTaskForm();
    else if (action === 'cancel-task' || action === 'modal-close') { const modal=$('.modal-backdrop'); if(modal) modal.remove(); else render(); }
    else if (action === 'make-task') makeTask(id);
    else if (action === 'delete-task') deleteTask(id);
    else if (action === 'edit-task') editItem('task', id);
    else if (action === 'edit-subject') editItem('subject', id);
    else if (action === 'edit-unit') editItem('unit', id);
    else if (action === 'edit-exam') editItem('exam', id);
    else if (action === 'delete-subject') deleteItem('subject', id);
    else if (action === 'delete-unit') deleteItem('unit', id);
    else if (action === 'cancel-exam-units') render();
    else if (action === 'save-exam-units') {
      db.examUnits = db.examUnits.filter(x => x.exam !== id);
      $('#app').querySelectorAll('input[name=examUnitChoice]:checked').forEach(input => db.examUnits.push({exam:id, unit:input.value}));
      save();
    }
    else if (action === 'add-exam') addExam();
    else if (action === 'add-test-record') testRecordEditor();
    else if (action === 'save-code-settings') saveExamCodeSettings();
    else if (action === 'add-blindspot-draft') { const f=$('#blindspotInput'); const v=f?.value.trim(); if(v){window.__studyflowBlindspots=window.__studyflowBlindspots||[]; if(!window.__studyflowBlindspots.some(x=>x.toLowerCase()===v.toLowerCase()))window.__studyflowBlindspots.push(v); f.value='';renderBlindspotDrafts();} }
    else if (action === 'remove-blindspot-draft') { window.__studyflowBlindspots=(window.__studyflowBlindspots||[]).filter((_,i)=>i!==Number(button.dataset.index));renderBlindspotDrafts(); }
    else if (action === 'save-test-record') saveTestRecord();
    else if (action === 'delete-test-record') { if(confirm('確定刪除此筆考試紀錄？')){db.testRecords=(db.testRecords||[]).filter(r=>r.id!==id);save();} }
    else if (action === 'toggle-corrected') { const record=(db.testRecords||[]).find(r=>r.id===id); if(record){record.corrected=!record.corrected;save();} }
    else if (action === 'delete-exam') {
      if (confirm('確定刪除此考試？')) {
        db.exams = db.exams.filter(x => x.id !== id);
        db.examUnits = db.examUnits.filter(x => x.exam !== id);
        save();
      }
    } else if (action === 'choose-exam-units') chooseExamUnits(id);
    else if (action === 'backup') backup();
    else if (action === 'restore-pick') $('#restoreFile').click();
    else if (action === 'clear-all') {
      if (confirm('確定清除全部資料？此動作無法復原。')) { db = EMPTY_DB(); save(); }
    }
  });

  $('#app').addEventListener('change', event => {
    const input = event.target;
    if(input.id==='examStatsSubject'){ const selected=input.value; render(); const next=$('#examStatsSubject'); if(next) next.value=selected; return; }
    const action = input.dataset.action;
    const id = input.dataset.id;
    if (action === 'toggle-task') {
      const task = db.tasks.find(x => x.id === id);
      if (task) { task.done = input.checked; if (task.unit) { const linkedUnit = db.units.find(x => x.id === task.unit); if (linkedUnit) linkedUnit.done = input.checked; } save(); }
    } else if (action === 'toggle-unit') {
      const unit = db.units.find(x => x.id === id);
      if (unit) { unit.done = input.checked; db.tasks.filter(x => x.unit === id).forEach(task => task.done = input.checked); save(); }
    } else if (input.id === 'restoreFile') {
      restoreFile(input.files && input.files[0]);
      input.value = '';
    }
  });

  $('#themeBtn').addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    safeSet(THEME_KEY, isDark ? 'dark' : 'light');
  });

  if (safeGet(THEME_KEY) === 'dark') document.documentElement.classList.add('dark');
  render();
})();
</script>
</body>
</html>
